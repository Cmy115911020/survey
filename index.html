<!DOCTYPE html>

<style>
:root{--pri:#7a2e4a;--pri-l:#f6eaef;--bd:#ddd;--tx:#222;--mut:#666;--err:#c0392b;--bg:#faf8f9}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.7}
.wrap{max-width:860px;margin:0 auto;padding:16px}
header{background:var(--pri);color:#fff;border-radius:12px;padding:24px;margin-bottom:16px}
header h1{margin:0 0 10px;font-size:1.4rem}
header p{margin:6px 0;font-size:.95rem}
.progress{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.bar{height:8px;background:#e6dde1;border-radius:4px;overflow:hidden}
.bar>div{height:100%;width:0;background:var(--pri);transition:width .2s}
.ptxt{font-size:.8rem;color:var(--mut);text-align:right}
section.sec{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px}
section.sec>h2{margin:0 0 6px;font-size:1.15rem;color:var(--pri);border-bottom:2px solid var(--pri-l);padding-bottom:6px}
.note{color:var(--mut);font-size:.9rem;margin:6px 0 12px}
h3{font-size:1rem;margin:18px 0 6px;color:var(--pri)}
.q{padding:14px 0;border-bottom:1px dashed var(--bd)}
.q:last-child{border-bottom:none}
.q.err{background:#fdf1ef;border-radius:8px;padding:14px 10px}
.qt{font-weight:600;margin-bottom:8px}
.req{color:var(--err)}
.hint{font-weight:400;color:var(--mut);font-size:.85rem}
.likert{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.likert label{border:1px solid var(--bd);border-radius:8px;padding:8px 2px;text-align:center;cursor:pointer;font-size:.82rem;line-height:1.3;background:#fff}
.likert label b{display:block;font-size:1.05rem}
.likert input{display:none}
.likert input:checked+span{color:#fff}
.likert label:has(input:checked){background:var(--pri);color:#fff;border-color:var(--pri)}
.nps{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.nps label{border:1px solid var(--bd);border-radius:8px;text-align:center;padding:8px 0;cursor:pointer;background:#fff}
.nps input{display:none}
.nps label:has(input:checked){background:var(--pri);color:#fff;border-color:var(--pri)}
.npsl{display:flex;justify-content:space-between;font-size:.78rem;color:var(--mut);margin-top:4px}
.opts label{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:6px;cursor:pointer}
.opts label:hover{background:var(--pri-l)}
.opts input{margin-top:6px;accent-color:var(--pri)}
.opts label.dis{opacity:.4;cursor:not-allowed}
input[type=text],input[type=number],select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:#fff}
textarea{min-height:90px;resize:vertical}
.other{margin:2px 0 4px 30px;width:calc(100% - 30px)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.inline{display:flex;gap:16px;flex-wrap:wrap}
.cnt{font-size:.8rem;color:var(--mut);margin-top:4px}
.hide{display:none!important}
.errmsg{color:var(--err);font-size:.85rem;margin-top:6px;display:none}
.q.err .errmsg{display:block}
button.submit{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:14px 32px;font-size:1.05rem;cursor:pointer;width:100%}
button.submit:hover{opacity:.92}
.done{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:32px;text-align:center}
@media(max-width:600px){.likert{grid-template-columns:repeat(5,1fr);gap:3px}.likert label{font-size:.72rem}.row3{grid-template-columns:1fr}.nps{grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<div id="formArea">
<header>
  <h1>金陵女中家長教育品質與推薦意願調查問卷</h1>
  <p>親愛的家長，您好：</p>
  <p>本問卷旨在了解家長對金陵女中教育品質、孩子學習與成長、整體滿意度及推薦意願的看法，並蒐集對學校未來發展的意見。本問卷沒有標準答案，請依您與孩子的實際經驗與感受作答。</p>
  <p>若家中有兩位以上子女目前就讀金陵，請選定其中一位孩子，並全程以同一位孩子的就讀經驗作答。涉及學校教學或教師表現的題目，請盡量綜合孩子接觸不同科目、不同教師的整體經驗判斷，而非僅以單一科目或單一教師的經驗作答。</p>
  <p><b>核心題目：1＝非常不同意｜2＝不同意｜3＝普通｜4＝同意｜5＝非常同意</b></p>
</header>
<div class="progress"><div class="bar"><div id="bar"></div></div><div class="ptxt" id="ptxt"></div></div>
<form id="f" novalidate></form>
</div>
</div>

/* ============ 產生表單 ============ */
const form=document.getElementById("f");
const ALLQ=[];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(q){
  const n="q"+q.id;
  let h=`<div class="q" id="wrap${q.id}" data-id="${q.id}"><div class="qt">${q.id}. ${esc(q.t)}${q.optional?' <span class="hint">（選填）</span>':' <span class="req">*</span>'}</div>`;
  if(q.type==="likert"){
    h+='<div class="likert">'+LK.map((l,i)=>`<label><input type="radio" name="${n}" value="${i+1}"><b>${i+1}</b>${l}</label>`).join("")+'</div>';
  }else if(q.type==="nps"){
    h+='<div class="nps">'+[...Array(11).keys()].map(i=>`<label><input type="radio" name="${n}" value="${i}">${i}</label>`).join("")+'</div><div class="npsl"><span>0＝完全不可能</span><span>10＝非常可能</span></div>';
  }else if(q.type==="radio"||q.type==="check"){
    const opts=q.opts==="REASONS"?REASONS:q.opts, t=q.type==="radio"?"radio":"checkbox";
    h+=`<div class="opts ${q.inline?"inline":""}" id="opts${q.id}">`+opts.map(o=>`<label><input type="${t}" name="${n}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join("")+'</div>';
    if(q.other)h+=`<input type="text" class="other hide" id="other${q.id}" placeholder="請說明">`;
    if(q.type==="check")h+=`<div class="cnt" id="cnt${q.id}"></div>`;
  }else if(q.type==="text"){
    h+=`<input type="text" name="${n}">`;
  }else if(q.type==="area"){
    h+=`<textarea name="${n}"></textarea>`;
  }else if(q.type==="texts3"){
    h+='<div class="row3">'+[1,2,3].map(i=>`<input type="text" name="${n}_${i}" placeholder="${"①②③"[i-1]}">`).join("")+'</div>';
  }else if(q.type==="select"){
    h+=`<select name="${n}"><option value="">請選擇班級</option>`+q.opts.map(o=>`<option value="${o}">${o}</option>`).join("")+'</select>';
  }else if(q.type==="number"){
    h+=`<input type="number" name="${n}" min="0" max="12" step="0.5" inputmode="decimal" style="max-width:160px">`;
  }else if(q.type==="q33"){
    h+=`<div class="opts" id="opts33"><div class="hint">請先回答上一題</div></div>`;
  }
  h+='<div class="errmsg">請完成此題</div></div>';
  return h;
}

let html="";
SECTIONS.forEach(s=>{
  html+=`<section class="sec"><h2>${s.title}</h2>`+(s.note?`<div class="note">${s.note}</div>`:"");
  s.groups.forEach(g=>{
    if(g.sub)html+=`<h3>${g.sub}</h3>`;
    g.qs.forEach(q=>{ALLQ.push(q);html+=render(q)});
  });
  html+="</section>";
});
html+='<button type="submit" class="submit">送出問卷</button><p class="note" style="text-align:center">★ 問卷到此結束，感謝您撥冗填答！ ★</p>';
form.innerHTML=html;

/* ============ 互動邏輯 ============ */
const $=id=>document.getElementById(id);
const byId=id=>ALLQ.find(q=>q.id===id);
const checked=(id)=>[...form.querySelectorAll(`[name=q${id}]:checked`)].map(e=>e.value);

form.addEventListener("change",e=>{
  const el=e.target, m=/^q(\d+)/.exec(el.name||"");
  if(!m){return}
  const id=+m[1], q=byId(id);
  // 其他 文字框
  if(q.other){
    const on=checked(id).includes(q.other);
    $("other"+id).classList.toggle("hide",!on);
    if(!on)$("other"+id).value="";
  }
  // 複選限制與互斥
  if(q.type==="check"){
    if(q.exclusive&&el.checked){
      if(el.value===q.exclusive){form.querySelectorAll(`[name=q${id}]`).forEach(i=>{if(i!==el)i.checked=false})}
      else{form.querySelectorAll(`[name=q${id}]`).forEach(i=>{if(i.value===q.exclusive)i.checked=false})}
    }
    updateLimit(q);
  }
  // Q25 → Q26 排除
  if(id===25){
    const v=checked(25)[0];
    form.querySelectorAll("[name=q26]").forEach(i=>{
      const same=i.value===v;
      if(same)i.checked=false;
      i.disabled=same; i.closest("label").classList.toggle("dis",same);
    });
    if(q.other&&$("other26")&&v==="其他"){}
    updateLimit(byId(26));
  }
  // Q30 → Q31
  if(id===30){
    const show=checked(30)[0]==="是，最後選擇其他高中";
    $("wrap31").classList.toggle("hide",!show);
    if(!show)form.querySelector("[name=q31]").value="";
  }
  // Q32 → Q33
  if(id===32)buildQ33();
  progress();
});
form.addEventListener("input",progress);

function updateLimit(q){
  const boxes=[...form.querySelectorAll(`[name=q${q.id}]`)];
  const n=boxes.filter(b=>b.checked).length;
  boxes.forEach(b=>{
    const lock=!b.checked&&n>=q.max;
    if(!(q.id===26&&b.closest("label").classList.contains("dis")))b.disabled=lock;
    if(q.id!==26||!b.closest("label").classList.contains("dis"))b.closest("label").classList.toggle("dis",lock);
  });
  $("cnt"+q.id).textContent=`已選 ${n} / 至多 ${q.max} 項`;
}
function buildQ33(){
  const sel=checked(32), box=$("opts33"), prev=checked(33)[0];
  if(!sel.length){box.innerHTML='<div class="hint">請先回答上一題</div>';return}
  box.innerHTML=sel.map(o=>`<label><input type="radio" name="q33" value="${esc(o)}" ${o===prev?"checked":""}><span>${esc(o)}</span></label>`).join("");
}
// 初始
$("wrap31").classList.add("hide");
ALLQ.filter(q=>q.type==="check").forEach(updateLimit);

/* ============ 驗證與進度 ============ */
function visible(q){return !$("wrap"+q.id).classList.contains("hide")}
function answered(q){
  const n="q"+q.id;
  if(q.type==="texts3")return [1,2,3].some(i=>form.elements[n+"_"+i].value.trim());
  if(["radio","check","likert","nps","q33"].includes(q.type)){
    const v=checked(q.id);
    if(q.type==="check")return v.length>=(q.min||1)&&v.length<=q.max;
    return v.length>0;
  }
  const el=form.elements[n]; return el&&el.value.trim()!=="";
}
function progress(){
  const req=ALLQ.filter(q=>!q.optional&&visible(q));
  const d=req.filter(answered).length;
  $("bar").style.width=(d/req.length*100)+"%";
  $("ptxt").textContent=`已完成 ${d} / ${req.length} 題`;
}
progress();

form.addEventListener("submit",async e=>{
  e.preventDefault();
  let first=null;
  ALLQ.forEach(q=>{
    const w=$("wrap"+q.id); w.classList.remove("err");
    if(q.optional||!visible(q))return;
    let ok=answered(q);
    if(ok&&q.other&&checked(q.id).includes(q.other)&&!$("other"+q.id).value.trim()&&q.id!==44)ok=false;
    if(!ok){w.classList.add("err");first=first||w}
  });
  if(first){first.scrollIntoView({behavior:"smooth",block:"center"});return}

  const data={submittedAt:new Date().toISOString()};
  ALLQ.forEach(q=>{
    const k="Q"+q.id;
    if(!visible(q)){data[k]="";return}
    if(q.type==="texts3"){data[k]=[1,2,3].map(i=>form.elements["q"+q.id+"_"+i].value.trim()).filter(Boolean).join("；");return}
    if(["radio","check","likert","nps","q33"].includes(q.type)){
      let v=checked(q.id);
      if(q.other&&v.includes(q.other)){v=v.map(x=>x===q.other?q.other+":"+$("other"+q.id).value.trim():x)}
      data[k]=q.type==="check"?v.join("；"):(v[0]??"");
    }else data[k]=form.elements["q"+q.id].value.trim();
  });
  console.log(data);
  if(GOOGLE_FORM.action){
    const body=new URLSearchParams();
    Object.keys(GOOGLE_FORM.entries).forEach(k=>body.append(GOOGLE_FORM.entries[k],data[k]??""));
    try{await fetch(GOOGLE_FORM.action,{method:"POST",mode:"no-cors",body})}
    catch(err){alert("傳送失敗，將改為下載檔案。");downloadCSV(data)}
  }else if(ENDPOINT){
    try{await fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(data)})}
    catch(err){alert("傳送失敗，將改為下載檔案。");downloadCSV(data)}
  }else downloadCSV(data);
  $("formArea").innerHTML='<div class="done"><h2>感謝您的填答！</h2><p>您的問卷已送出。</p></div>';
  window.scrollTo({top:0,behavior:"smooth"});
});

function downloadCSV(d){
  const keys=Object.keys(d), q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const csv="﻿"+keys.map(q).join(",")+"\n"+keys.map(k=>q(d[k])).join(",");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download="問卷回覆_"+Date.now()+".csv";a.click();
}
</script>
</body>
</html>
